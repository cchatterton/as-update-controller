name: Verify and publish catalogue
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-catalogue.py
      - name: Publish verified metadata
        run: |
          if ! git diff --quiet -- catalogue.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add catalogue.json
            git commit -m 'Refresh verified release catalogue'
            git push
          fi
